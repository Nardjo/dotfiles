# Link manifest: <path in this repo> <target path on the machine>
# Add one line per app. $HOME is expanded by install.sh.
zed                 $HOME/.config/zed
warp                $HOME/.warp
nvim                $HOME/.config/nvim
tmux                $HOME/.config/tmux
ghostty             $HOME/.config/ghostty
yazi                $HOME/.config/yazi
delta               $HOME/.config/delta
bat/syntaxes        $HOME/.config/bat/syntaxes
starship/starship.toml  $HOME/.config/starship.toml
gitmux/gitmux.conf      $HOME/.gitmux.conf
lazygit/config.yml      $HOME/Library/Application Support/lazygit/config.yml

# herdr: single files, never the whole directory - it also holds sockets,
# logs and live session state.
herdr/config.toml       $HOME/.config/herdr/config.toml
herdr/agent-auto-jump.py    $HOME/.config/herdr/agent-auto-jump.py
herdr/dev.herdr.agent-auto-jump.plist  $HOME/Library/LaunchAgents/dev.herdr.agent-auto-jump.plist

# tmux <-> herdr switch, run by Ghostty's `command` and by Raycast
mux/mux                 $HOME/.config/mux

# visible-pane command runner, shared by both agents and both multiplexers
claude/bin/pane-run     $HOME/.claude/bin/pane-run
claude/hooks/pane-route.cjs  $HOME/.claude/hooks/pane-route.cjs
omp/extensions/pane-run.ts   $HOME/.omp/agent/extensions/pane-run.ts

# shell functions only; ~/.zshalias stays out of the repo, it holds API keys
zsh/functions.zsh       $HOME/.config/zsh/functions.zsh
