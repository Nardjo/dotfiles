# GrokDay. INK is the colour written on top of the coloured blocks: on a
# light palette the pale value is the block text, the saturated one the fill.
%hidden BASE="#f5f5f5"
%hidden SURFACE="#eaeaea"
%hidden TEXT="#262626"
%hidden MUTED="#767676"
%hidden GREEN="#378e23"
%hidden PINK="#7d4bc6"
%hidden BLUE="#2f64d2"
%hidden INK="#f5f5f5"

source-file ~/.config/tmux/theme.conf
